function flashCards(lv){
 const rk=["easy","medium","hard"][lv-1];
 const rp=FR[rk],mp=FM[rk];
 const rw=rp.map(x=>x.w),mw=mp.map(x=>x.w);
 const rc=pk(rp,3).map(r=>({type:"reading",question:r.q,answer:r.w,visual:r.v,choices:sh([r.w,...sh(rw.filter(x=>x!==r.w)).slice(0,3)])}));
 const mc=pk(mp,3).map(m=>({type:"math",question:m.q,answer:m.w,visual:m.v,choices:sh([m.w,...sh(mw.filter(x=>x!==m.w)).slice(0,3)])}));
 return sh([...rc,...mc]);
}

// MATH POP - procedural (infinite variety)
function mathPop(lv){
 return Array.from({length:6},()=>{
  let q,a;
  if(lv===1){const x=ri(1,5),y=ri(1,5);if(Math.random()>.5){q=`${x}+${y}`;a=x+y;}else{const s=x+y;q=`${s}-${x}`;a=y;}}
  else if(lv===2){const x=ri(1,10),y=ri(1,10);const t=Math.random();if(t<.4){q=`${x}+${y}`;a=x+y;}else if(t<.7){const s=x+y;q=`${s}-${x}`;a=y;}else{const p=ri(2,5),r2=ri(2,5);q=`${p}×${r2}`;a=p*r2;}}
  else{const x=ri(10,30),y=ri(10,30);const t=Math.random();if(t<.35){q=`${x}+${y}`;a=x+y;}else if(t<.6){const s=x+y;q=`${s}-${x}`;a=y;}else{const p=ri(2,9),r2=ri(2,9);q=`${p}×${r2}`;a=p*r2;}}
  const w=new Set();while(w.size<3){const d=a+ri(-4,4);if(d!==a&&d>=0)w.add(d);}
  return{question:q,answer:a,choices:sh([a,...w])};
 });
}

function numOrder(lv){
 return Array.from({length:6},()=>{
  let nums,dir,label;
  if(lv===1){nums=sh([...new Set(Array.from({length:6},()=>ri(1,20)))].slice(0,4));dir="asc";label="smallest to biggest";}
  else if(lv===2){nums=sh([...new Set(Array.from({length:6},()=>ri(1,100)))].slice(0,4));dir=Math.random()>.5?"asc":"desc";label=dir==="asc"?"smallest to biggest":"biggest to smallest";}
  else{nums=sh([...new Set(Array.from({length:6},()=>ri(1,999)))].slice(0,4));dir=Math.random()>.5?"asc":"desc";label=dir==="asc"?"smallest to biggest":"biggest to smallest";}
  const sorted=[...nums].sort((a,b)=>dir==="asc"?a-b:b-a);
  if(nums.join(",")===sorted.join(","))nums=sh(nums);
  return{numbers:nums,direction:dir,label};
 });
}

// GREATER OR LESS - procedural
function greaterLess(lv){
 return Array.from({length:8},()=>{
  let l,r,answer,question;
  if(lv===1){l=ri(1,9);r=ri(1,9);while(r===l)r=ri(1,9);const t=Math.random();question=t<.5?"Which number is GREATER?":"Which number is LESS?";answer=t<.5?(l>r?"left":"right"):(l<r?"left":"right");}
  else if(lv===2){l=ri(1,50);r=ri(1,50);while(r===l)r=ri(1,50);const t=Math.random();question=t<.5?"Which number is GREATER?":"Which number is LESS?";answer=t<.5?(l>r?"left":"right"):(l<r?"left":"right");}
  else{l=ri(1,999);r=ri(1,999);const t=Math.random();if(t<.3){question="Are these numbers EQUAL?";l=ri(1,100);r=l;answer="equal";}else{question=t<.65?"Which number is GREATER?":"Which number is LESS?";answer=t<.65?(l>r?"left":"right"):(l<r?"left":"right");}}
  return{left:l,right:r,answer,question};
 });
}

function placeValue(lv){
 return Array.from({length:6},()=>{
  let num,question,answer,choices;
  if(lv===1){
   num=ri(11,99);const tens=Math.floor(num/10),ones=num%10;
   if(Math.random()>.5){question=`In the number ${num}, what is the TENS digit?`;answer=String(tens);const w=new Set();while(w.size<3){const d=ri(1,9);if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
   else{question=`In the number ${num}, what is the ONES digit?`;answer=String(ones);const w=new Set();while(w.size<3){const d=ri(0,9);if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
  }else if(lv===2){
   num=ri(11,99);const tens=Math.floor(num/10),ones=num%10;
   const t=Math.random();
   if(t<.33){question=`How many TENS are in ${num}?`;answer=String(tens);const w=new Set();while(w.size<3){const d=ri(1,9);if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
   else if(t<.66){question=`What is the value of the tens in ${num}?`;answer=String(tens*10);const w=new Set();while(w.size<3){const d=ri(1,9)*10;if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
   else{question=`How many ONES are in ${num}?`;answer=String(ones);const w=new Set();while(w.size<3){const d=ri(0,9);if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
  }else{
   num=ri(100,999);const h=Math.floor(num/100),t2=Math.floor((num%100)/10),o=num%10;
   const q=Math.random();
   if(q<.33){question=`How many HUNDREDS are in ${num}?`;answer=String(h);const w=new Set();while(w.size<3){const d=ri(1,9);if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
   else if(q<.66){question=`What is the value of the HUNDREDS digit in ${num}?`;answer=String(h*100);const w=new Set();while(w.size<3){const d=ri(1,9)*100;if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
   else{question=`What is the value of the TENS digit in ${num}?`;answer=String(t2*10);const w=new Set();while(w.size<3){const d=ri(0,9)*10;if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
  }
  return{number:num,question,answer,choices};
 });
}

// SKIP COUNTING - procedural
function skipCounting(lv){
 return Array.from({length:6},()=>{
  let skipBy,start;
  if(lv===1){skipBy=Math.random()>.5?2:5;start=ri(0,5)*skipBy;}
  else if(lv===2){const opts=[2,5,10];skipBy=rnd(opts);start=ri(0,8)*skipBy;}
  else{const opts=[3,4,6,7];skipBy=rnd(opts);start=ri(0,6)*skipBy;}
  const seq=Array.from({length:5},(_,i)=>start+i*skipBy);
  const mi=ri(0,4);const answer=seq[mi];
  const disp=seq.map((n,i)=>i===mi?null:n);
  const w=new Set();while(w.size<3){const d=answer+skipBy*(ri(0,3)-1);if(d!==answer&&d>=0)w.add(d);}
  return{sequence:disp,skipBy,answer,missingIndex:mi,choices:sh([answer,...w])};
 });
}

// TELLING TIME - procedural
function tellingTime(lv){
 return Array.from({length:6},()=>{
  const h=ri(1,12);
  let m;
  if(lv===1)m=0;
  else if(lv===2)m=Math.random()>.5?0:30;
  else{const opts=[0,15,30,45];m=rnd(opts);}
  const display=`${h}:${m===0?"00":m}`;
  const w=new Set();
  while(w.size<3){
   const wh=ri(1,12);
   let wm;
   if(lv===1)wm=0;
   else if(lv===2)wm=Math.random()>.5?0:30;
   else{const opts=[0,15,30,45];wm=rnd(opts);}
   const wt=`${wh}:${wm===0?"00":wm}`;
   if(wt!==display)w.add(wt);
  }
  return{hours:h,minutes:m,displayTime:display,question:"What time does the clock show?",choices:sh([display,...w])};
 });
}

const CVAL={quarter:25,dime:10,nickel:5,penny:1};

function countMoney(lv){
 return Array.from({length:6},()=>{
  let coins=[],total=0;
  const types=lv===1?["penny","nickel"]:lv===2?["penny","nickel","dime"]:["penny","nickel","dime","quarter"];
  const n=ri(2,lv===1?4:lv===2?5:6);
  for(let i=0;i<n;i++){const c=rnd(types);coins.push(c);total+=CVAL[c];}
  const answer=`${total} cents`;
  const w=new Set();while(w.size<3){const d=total+ri(-5,5);if(d!==total&&d>0)w.add(`${d} cents`);}
  return{coins,totalCents:total,question:"How much money is this?",choices:sh([answer,...w])};
 });
}

// ═══════════════════ SHARED UI HELPERS ═══════════════════
function pb(cur,tot,score){return `<div class="pw"><div class="pb"><div class="pf" style="width:${(cur/tot)*100}%;"></div></div><div class="ps">⭐${score} | ${cur+1}/${tot}</div></div>`;}
function ms(state){const c={idle:{e:"😊",a:""},correct:{e:"🎉",a:"animation:bounce .5s ease;"},wrong:{e:"😅",a:"animation:shake .4s ease;"}}[state]||{e:"😊",a:""};return `<div style="text-align:center;margin-bottom:8px;"><div style="font-size:38px;${c.a}">${c.e}</div></div>`;}
function ab(choices,answer,chosen){return choices.map((c,ci)=>{const isC=String(c).toLowerCase()===String(answer).toLowerCase();const tp=chosen===ci;const rv=chosen!==null;let cls="ab";if(rv&&isC)cls+=" ok";else if(tp&&!isC)cls+=" no";else if(rv)cls+=" dm";return `<button class="mc ${cls}" data-ci="${ci}">${rv&&isC?"✅ ":tp&&!isC?"❌ ":""}${c}</button>`;}).join("");}
function bmc(el,ch,fn){el.querySelectorAll(".mc").forEach(b=>b.addEventListener("click",()=>{if(ch!==null)return;fn(parseInt(b.dataset.ci));}));}
function lbl(e,t,c){return `<div class="gl" style="color:${c};">${e} <span>${t}</span></div>`;}
function fb(ok,w=""){return ok?`<div style="text-align:center;margin-top:10px;animation:fadeUp .3s ease;"><div style="font-family:'Bangers','Arial Black',sans-serif;font-size:22px;color:#00D68F;letter-spacing:1.5px;">🎉 CORRECT!</div></div>`:`<div style="text-align:center;margin-top:10px;animation:fadeUp .3s ease;"><div style="font-family:'Bangers','Arial Black',sans-serif;font-size:18px;color:#FF4757;letter-spacing:1px;">😅 ANSWER: <span style="font-family:'Nunito',sans-serif;font-weight:900;color:#1A0A3E;">${w}</span></div></div>`;}

// G1 Flash Cards
function rFlash(el,cards,lv,done){let i=0,sc=0,ch=null;function show(){const c=cards[i];const col=c.type==="math"?"#00A8FF":"#FF6B9D";el.innerHTML=`${pb(i,cards.length,sc)}${ms(ch===null?"idle":String((c.choices||[])[ch]).toLowerCase()===String(c.answer).toLowerCase()?"correct":"wrong")}<div class="card" style="border-top:5px solid ${col};"><div style="position:absolute;top:14px;left:14px;background:${c.type==="math"?"linear-gradient(135deg,#00A8FF,#0077CC)":"linear-gradient(135deg,#FF6B9D,#E040A0)"};color:white;border-radius:10px;padding:3px 10px;font-family:'Bangers','Arial Black',sans-serif;font-size:13px;letter-spacing:1px;">${c.type==="math"?"🔢 MATH":"📖 READING"}</div>${c.visual?`<div style="font-size:42px;text-align:center;margin-top:8px;">${c.visual}</div>`:""}<div style="font-size:20px;font-family:'Nunito',sans-serif;font-weight:800;color:#1A0A3E;text-align:center;margin-top:${c.visual?"8":"28"}px;line-height:1.4;">${c.question}</div><div class="g2" style="margin-top:14px;">${ab(c.choices||[],c.answer,ch)}</div>${ch!==null?fb(String((c.choices||[])[ch]).toLowerCase()===String(c.answer).toLowerCase(),c.answer):""}</div>`;if(ch===null)bmc(el,ch,(ci)=>{ch=ci;const ok=String(cards[i].choices[ci]).toLowerCase()===String(cards[i].answer).toLowerCase();ok?playOK():playNo();show();setTimeout(()=>{const ns=ok?sc+1:sc;if(i+1>=cards.length)done(ns,cards.length);else{sc=ns;i++;ch=null;show();}},1300);});}show();}

// G2 Math Pop
function rPop(el,rounds,lv,done){let i=0,sc=0,pp=null;function show(){const r=rounds[i];el.innerHTML=`${pb(i,rounds.length,sc)}<div class="card">${lbl("🫧","MATH POP","#00A8FF")}<div style="font-size:28px;font-family:'Nunito',sans-serif;font-weight:900;color:#1A0A3E;text-align:center;margin-bottom:4px;">${r.question} = ?</div><div style="font-size:13px;color:#A89CC8;text-align:center;margin-bottom:14px;">Pop the right bubble! 🫧</div><div class="g2" style="gap:12px;">${r.choices.map((c,ci)=>{const isC=c===r.answer;const tp=pp===ci;const rv=pp!==null;let bg="#F0EAFF",bo="3px solid #D0C8F0",tc="#1A0A3E";if(rv&&isC){bg="#E8FFF4";bo="3px solid #00D68F";tc="#00A86B";}else if(tp&&!isC){bg="#FFF0F2";bo="3px solid #FF4757";tc="#CC2F3E";}return `<button class="pb2" data-ci="${ci}" style="background:${bg};border:${bo};border-radius:20px;padding:20px 8px;font-family:'Nunito',sans-serif;font-weight:900;font-size:28px;color:${tc};animation:${rv&&isC?"pop .4s ease":`bFloat ${1.2+ci*.3}s ease-in-out infinite`};">${rv&&isC?"✅":tp&&!isC?"❌":""} ${c}</button>`;}).join("")}</div></div>`;if(pp===null)el.querySelectorAll(".pb2").forEach(b=>b.addEventListener("click",()=>{if(pp!==null)return;pp=parseInt(b.dataset.ci);const ok=rounds[i].choices[pp]===rounds[i].answer;ok?playOK():playNo();show();setTimeout(()=>{const ns=ok?sc+1:sc;if(i+1>=rounds.length)done(ns,rounds.length);else{sc=ns;i++;pp=null;show();}},1100);}));}show();}

// G3 Fill in the Blank
function rFill(el,rounds,lv,done){let i=0,sc=0,ch=null;function show(){const r=rounds[i];const pts=r.s.split("___");el.innerHTML=`${pb(i,rounds.length,sc)}<div class="card">${lbl("✏️","FILL IN THE BLANK","#FF8C00")}<div style="font-size:20px;font-family:'Nunito',sans-serif;font-weight:800;color:#1A0A3E;text-align:center;line-height:1.7;margin-bottom:6px;background:#FFF8F0;border-radius:14px;padding:12px;">${pts[0]}<span style="display:inline-block;min-width:72px;border-bottom:3px solid #FF8C00;margin:0 5px;text-align:center;color:${ch!==null?"#FF8C00":"transparent"};vertical-align:bottom;font-weight:900;">${ch!==null?r.a:"____"}</span>${pts[1]||""}</div><div class="g2" style="margin-top:12px;">${ab(r.c,r.a,ch)}</div></div>`;if(ch===null)bmc(el,ch,(ci)=>{ch=ci;const ok=rounds[i].c[ci].toLowerCase()===rounds[i].a.toLowerCase();ok?playOK():playNo();show();setTimeout(()=>{const ns=ok?sc+1:sc;if(i+1>=rounds.length)done(ns,rounds.length);else{sc=ns;i++;ch=null;show();}},1200);});}show();}

// G4 Match Pairs
function rMatch(el,pairs,lv,done){const deck=[];pairs.forEach((p,j)=>{deck.push({id:`a${j}`,content:p.word,pairId:j});deck.push({id:`b${j}`,content:p.match,pairId:j});});for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}let fl=[],mt=[],ck=false,sc=0;const tot=6;function show(){el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div style="font-family:'Bangers','Arial Black',sans-serif;font-size:15px;color:rgba(255,255,255,.7);letter-spacing:1px;">🔀 MATCH PAIRS</div><div style="font-family:'Bangers','Arial Black',sans-serif;font-size:16px;color:#FFD93D;">⭐${sc}/${tot}</div></div><div class="g3" style="gap:9px;">${deck.map(card=>{const s2=!!fl.find(f=>f.id===card.id)||mt.includes(card.pairId);const isM=mt.includes(card.pairId);return `<button class="fp" data-id="${card.id}" style="background:${isM?"#E8FFF4":s2?"white":"linear-gradient(135deg,#6C3FC8,#9B6FE8)"};border:${isM?"2px solid #00D68F":s2?"2px solid #D0C8F0":"none"};border-radius:14px;padding:16px 6px;min-height:65px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:${isM?"#00A86B":s2?"#1A0A3E":"transparent"};animation:${s2&&!isM?"flipIn .3s ease":isM?"pop .3s ease":"none"};">${s2?card.content:"❓"}</button>`;}).join("")}</div><div style="text-align:center;margin-top:12px;font-family:'Nunito',sans-serif;font-size:13px;color:rgba(255,255,255,.5);">${mt.length}/${tot} pairs found</div>`;el.querySelectorAll(".fp").forEach(b=>b.addEventListener("click",()=>{if(ck)return;const card=deck.find(c=>c.id===b.dataset.id);if(!card||fl.find(f=>f.id===card.id)||mt.includes(card.pairId)||fl.length===2)return;fl=[...fl,card];show();if(fl.length===2){ck=true;if(fl[0].pairId===fl[1].pairId){playOK();mt=[...mt,card.pairId];sc++;fl=[];ck=false;show();if(mt.length===tot)setTimeout(()=>done(mt.length,tot),600);}else{playNo();setTimeout(()=>{fl=[];ck=false;show();},900);}}}));}show();}

function rMoney(el,rounds,lv,done){let i=0,sc=0,ch=null;function show(){const r=rounds[i];const rv=ch!==null;const ans=`${r.totalCents} cents`;const cL=r.coins.reduce((a,c)=>{a[c]=(a[c]||0)+1;return a;},{});const cD=Object.entries(cL).map(([c,n])=>`${n} ${c}${n>1?"s":""}`).join(", ");el.innerHTML=`${pb(i,rounds.length,sc)}${ms(rv?(String((r.choices||[])[ch])===ans?"correct":"wrong"):"idle")}<div class="card">${lbl("💰","COUNT MONEY","#00A86B")}<div style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#6B5F8A;text-align:center;margin-bottom:10px;background:#F0FFF8;border-radius:12px;padding:8px;">${r.question}</div><div style="background:linear-gradient(135deg,#FFFDE7,#FFF8E1);border:2px solid rgba(245,166,35,.3);border-radius:18px;padding:14px;margin-bottom:12px;text-align:center;"><div style="font-size:28px;line-height:2;margin-bottom:6px;">${r.coins.map(c=>CEMO[c]||"🟡").join(" ")}</div><div style="font-family:'Nunito',sans-serif;font-size:12px;color:#F5A623;font-weight:700;margin-bottom:8px;">${cD}</div><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;">${Object.entries({quarter:"25¢",dime:"10¢",nickel:"5¢",penny:"1¢"}).map(([c,v])=>`<span style="font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:#888;background:white;border-radius:8px;padding:2px 8px;">${CEMO[c]}=${v}</span>`).join("")}</div></div><div class="g2">${(r.choices||[]).map((c,ci)=>{const isC=String(c)===ans;const tp=ch===ci;let bg="rgba(0,214,143,.07)",bo="2px solid rgba(0,214,143,.2)",tc="#1A0A3E";if(rv&&isC){bg="#E8FFF4";bo="2px solid #00D68F";tc="#00A86B";}else if(tp&&!isC){bg="#FFF0F2";bo="2px solid #FF4757";tc="#CC2F3E";}return `<button class="mo" data-ci="${ci}" style="background:${bg};border:${bo};border-radius:14px;padding:14px 8px;font-family:'Bangers','Arial Black',sans-serif;font-size:20px;color:${tc};letter-spacing:1px;cursor:${rv?"default":"pointer"};animation:${rv&&isC?"pop .35s ease":"none"};">${rv&&isC?"✅ ":tp&&!isC?"❌ ":""}${c}</button>`;}).join("")}</div>${rv?fb(String((r.choices||[])[ch])===ans,ans):""}</div>`;if(!rv)el.querySelectorAll(".mo").forEach(b=>b.addEventListener("click",()=>{if(ch!==null)return;ch=parseInt(b.dataset.ci);const ok=String(rounds[i].choices[ch])===String(rounds[i].totalCents)+" cents";ok?playOK():playNo();show();setTimeout(()=>{const ns=ok?sc+1:sc;if(i+1>=rounds.length)done(ns,rounds.length);else{sc=ns;i++;ch=null;show();}},1300);}));}show();}

render();

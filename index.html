<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#6C3FC8"/>
<title>Brain Blast! 🚀</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-style:normal!important;}
:root{--pu:#6C3FC8;--pl:#9B6FE8;--ye:#FFD93D;--or:#FF8C00;--gr:#00D68F;--gd:#00A86B;--re:#FF4757;--rd:#CC2F3E;--bl:#00A8FF;--pk:#FF6B9D;--bg:#1A0A3E;}
body{background:var(--bg);min-height:100vh;font-family:"Nunito","Arial",sans-serif;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(1px 1px at 10% 15%,#fff,transparent),radial-gradient(1px 1px at 25% 45%,#fff,transparent),radial-gradient(2px 2px at 40% 10%,#fff,transparent),radial-gradient(1px 1px at 60% 30%,#fff,transparent),radial-gradient(2px 2px at 75% 60%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 85% 15%,#fff,transparent),radial-gradient(2px 2px at 15% 70%,#fff,transparent),radial-gradient(1px 1px at 50% 80%,#fff,transparent),radial-gradient(1px 1px at 90% 90%,#fff,transparent),radial-gradient(1px 1px at 35% 55%,#fff,transparent),radial-gradient(1px 1px at 65% 25%,#fff,transparent),radial-gradient(2px 2px at 5% 95%,#fff,transparent);pointer-events:none;z-index:0;}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.screen{width:100%;max-width:430px;padding:10px;margin:0 auto;position:relative;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.card{background:#fff;border-radius:24px;padding:14px 16px;box-shadow:0 8px 32px rgba(0,0,0,.25);position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--pu),var(--bl),var(--gr),var(--ye));border-radius:24px 24px 0 0;}
.btn{display:block;width:100%;padding:12px 16px;border:none;border-radius:14px;font-family:"Bangers","Arial Black",sans-serif;font-size:22px;letter-spacing:1.5px;cursor:pointer;transition:transform .1s;text-align:center;}
.btn:active{transform:scale(.94);}
.bp{background:linear-gradient(135deg,var(--pu),var(--pl));color:#fff;box-shadow:0 6px 20px rgba(108,63,200,.5);}
.bs{background:linear-gradient(135deg,var(--gr),#00E5A0);color:#fff;box-shadow:0 6px 20px rgba(0,214,143,.5);}
.bg2{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.3);}
.game-tile{background:#fff;border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border:none;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:transform .15s;}
.game-tile:active{transform:scale(.93);}
.pw{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.pb{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden;}
.pf{height:100%;border-radius:10px;transition:width .4s ease;background:linear-gradient(90deg,var(--ye),var(--or));}
.ps{font-family:"Bangers","Arial Black",sans-serif;font-size:18px;color:var(--ye);letter-spacing:1px;white-space:nowrap;}
.ab{padding:12px 8px;border:3px solid transparent;border-radius:14px;font-family:"Nunito","Arial",sans-serif;font-weight:800;font-size:18px;cursor:pointer;transition:all .18s;text-align:center;background:#F0EAFF;color:#1A0A3E;box-shadow:0 3px 8px rgba(0,0,0,.1);}
.ab:active:not([disabled]){transform:scale(.94);}
.ab.ok{background:#E8FFF4;border-color:var(--gr);color:var(--gd);animation:pop .35s ease;}
.ab.no{background:#FFF0F2;border-color:var(--re);color:var(--rd);}
.ab.dm{background:#F5F5F5;border-color:#ddd;color:#bbb;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.gl{font-family:"Bangers","Arial Black",sans-serif;font-size:18px;letter-spacing:1.5px;text-align:center;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;}
.sb2{background:linear-gradient(135deg,var(--pu),var(--bl));color:#fff;border-radius:8px;padding:3px 8px;font-family:"Nunito",sans-serif;font-size:10px;font-weight:700;display:inline-block;margin-top:4px;}
.cf{width:130px;height:130px;border-radius:50%;background:#fff;border:5px solid var(--pu);position:relative;margin:0 auto 12px;box-shadow:0 4px 16px rgba(108,63,200,.3);}
.ch{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:4px;}
.cn{position:absolute;font-family:"Bangers","Arial Black",sans-serif;font-size:13px;color:var(--pu);}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes pop{0%{transform:scale(0);opacity:0}80%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(32px) scale(.95);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes flipIn{from{transform:rotateY(90deg);opacity:0}to{transform:rotateY(0);opacity:1}}
@keyframes bFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{0%{transform:rotate(0)}50%{transform:rotate(25deg) scale(1.2)}100%{transform:rotate(0)}}
@keyframes starPop{0%{transform:scale(0) rotate(-20deg);opacity:0}70%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
@keyframes tileIn{from{transform:scale(.6) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

/* ── PUZZLE PIECES ── */
@keyframes piecePlace{0%{transform:scale(3) rotate(20deg);opacity:0}70%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes piecePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,217,61,0)}50%{box-shadow:0 0 0 10px rgba(255,217,61,.5)}}
@keyframes puzzleDone{0%{transform:scale(1)}25%{transform:scale(1.05)}75%{transform:scale(0.98)}100%{transform:scale(1)}}
@keyframes lockIn{from{transform:rotateY(90deg) scale(1.3);opacity:0}to{transform:rotateY(0) scale(1);opacity:1}}
.puzzle-cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;transition:all .3s;}
.puzzle-cell.filled{animation:piecePlace .6s cubic-bezier(.2,1.5,.4,1) forwards;}
.puzzle-cell.newest{animation:piecePlace .7s cubic-bezier(.2,1.6,.3,1) forwards,piecePulse 1s ease .7s 3;}
.puzzle-cell.empty{background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.18);}

/* ── SPACE RUN GAME ── */
@keyframes runCycle{0%,100%{transform:translateY(0) scaleY(1)}25%{transform:translateY(-4px) scaleY(1.05)}75%{transform:translateY(2px) scaleY(0.95)}}
@keyframes jumpArc{0%{transform:translateY(0)}50%{transform:translateY(-90px)}100%{transform:translateY(0)}}
@keyframes obstacleSlide{from{transform:translateX(0)}to{transform:translateX(-110vw)}}
@keyframes starFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.1)}}
@keyframes starCollect{0%{transform:scale(1);opacity:1}50%{transform:scale(2) translateY(-20px);opacity:.8}100%{transform:scale(0) translateY(-40px);opacity:0}}
@keyframes groundScroll{from{background-position:0 0}to{background-position:-200px 0}}
@keyframes flashRed{0%,100%{background:transparent}50%{background:rgba(255,71,87,.3)}}
@keyframes lifeOut{from{transform:scale(1);opacity:1}to{transform:scale(0) rotate(180deg);opacity:0}}
@keyframes bonusReveal{0%{transform:scale(0) rotate(-15deg);opacity:0}70%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
#space-run-canvas{display:block;width:100%;border-radius:20px;touch-action:none;background:linear-gradient(180deg,#0A0020 0%,#1A0A3E 40%,#0D1B3E 70%,#1a3a1a 85%,#2d5a1a 100%);}

@keyframes piecePlace{0%{transform:scale(3) rotate(15deg);opacity:0}60%{transform:scale(1.15) rotate(-3deg);opacity:1}80%{transform:scale(0.95)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes piecePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,217,61,0)}50%{box-shadow:0 0 0 8px rgba(255,217,61,.4)}}
@keyframes puzzleComplete{0%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(0.97)}100%{transform:scale(1)}}
@keyframes bonusReveal{from{transform:scale(0) rotate(-10deg);opacity:0}70%{transform:scale(1.1) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes firework{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--fx),var(--fy)) scale(0);opacity:0}}
.puzzle-piece{border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;transition:transform .2s;position:relative;overflow:hidden;}
.puzzle-piece.filled{animation:piecePlace .6s cubic-bezier(.2,1.4,.4,1) forwards;}
.puzzle-piece.empty{background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.2);}
.puzzle-piece.new-piece{animation:piecePlace .7s cubic-bezier(.2,1.6,.3,1) forwards, piecePulse 1s ease .7s 2;}

/* ── COSMO + GAME ANIMATIONS ── */
@keyframes cosmoBounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-18px) rotate(5deg)}}
@keyframes cosmoFlip{0%{transform:rotate(0) scale(1)}40%{transform:rotate(360deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
@keyframes cosmoShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-12px)}30%{transform:translateX(12px)}45%{transform:translateX(-8px)}60%{transform:translateX(8px)}75%{transform:translateX(-4px)}90%{transform:translateX(4px)}}
@keyframes speechIn{from{transform:scale(0) translateY(10px);opacity:0;transform-origin:bottom left}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-120px) rotate(720deg);opacity:0}}
@keyframes confettiDown{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(200px) rotate(540deg);opacity:0}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes craneSwing{0%{transform:rotate(-60deg);opacity:0}60%{transform:rotate(5deg)}80%{transform:rotate(-3deg)}100%{transform:rotate(0deg);opacity:1}}
@keyframes flyIn{from{transform:translateY(-60px) scale(0.5) rotate(-15deg);opacity:0}80%{transform:translateY(4px) scale(1.1) rotate(2deg)}to{transform:translateY(0) scale(1) rotate(0);opacity:1}}
@keyframes whoosh{from{transform:translateX(120px) scale(0.7);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
@keyframes sparkle{0%{transform:scale(0) rotate(0);opacity:1}50%{transform:scale(1.4) rotate(180deg);opacity:1}100%{transform:scale(0) rotate(360deg);opacity:0}}
@keyframes correctPulse{0%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(0.97)}100%{transform:scale(1)}}
@keyframes wrongPulse{0%,100%{background:#FFF0F2}50%{background:#FFD0D5}}
@keyframes hintSlide{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes starBurst{0%{transform:scale(0) rotate(-30deg);opacity:1}60%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes craneArm{0%{transform:rotate(-80deg) translateY(-20px);opacity:0}70%{transform:rotate(8deg) translateY(0);opacity:1}85%{transform:rotate(-3deg)}100%{transform:rotate(0deg);opacity:1}}

/* Cosmo widget */
.cosmo-wrap{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;animation:slideUp .3s ease;}
.cosmo-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#1A0A3E,#3D1F8A);border:3px solid #FFD93D;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 4px 14px rgba(255,217,61,.4);}
.cosmo-bubble{background:white;border-radius:18px 18px 18px 4px;padding:10px 14px;font-family:"Nunito","Arial",sans-serif;font-weight:800;font-size:15px;color:#1A0A3E;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.15);animation:speechIn .3s ease;flex:1;line-height:1.4;}
.cosmo-bubble::before{content:"";position:absolute;bottom:0;left:-8px;border:8px solid transparent;border-right-color:white;border-bottom:0;border-left:0;}
.cosmo-idle .cosmo-avatar{animation:cosmoBounce 2.5s ease-in-out infinite;}
.cosmo-correct .cosmo-avatar{animation:cosmoFlip .7s ease;}
.cosmo-wrong .cosmo-avatar{animation:cosmoShake .5s ease;}

/* Confetti pieces */
.confetti-piece{position:fixed;pointer-events:none;z-index:9999;border-radius:3px;animation:confettiDown 1.2s ease forwards;}

/* Answer animations */
.ans-correct-anim{animation:correctPulse .4s ease,starBurst .5s ease;}
.ans-wrong-anim{animation:wrongPulse .6s ease;}

/* Crane for sentence builder */
.crane-word{animation:craneArm .5s cubic-bezier(.2,1.4,.4,1) forwards;}

/* Letter fly-in for unscramble */
.letter-fly{animation:flyIn .4s cubic-bezier(.2,1.4,.4,1) forwards;}

/* Whoosh for category sort */
.chip-whoosh{animation:whoosh .35s cubic-bezier(.2,1.4,.4,1);}

/* Match sparkle */
.match-sparkle{position:absolute;pointer-events:none;font-size:18px;animation:sparkle .6s ease forwards;}

</style>
</head>
<body><div id="app"></div>
<script>
"use strict";
let S={screen:"home",gameId:null,level:1,totalStars:0,lastScore:0,lastTotal:0,soloCharId:null,setupDone:false,puzzlePieces:0,puzzleTheme:null,bonusUnlocked:false,gamesCompleted:0,spaceRunBest:0};
function ss(u){Object.assign(S,u);render();}
function playOK(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="square";o.frequency.setValueAtTime(988,c.currentTime);o.frequency.setValueAtTime(1319,c.currentTime+.07);g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start(c.currentTime);o.stop(c.currentTime+.35);}catch(e){}}
function playNo(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.connect(f);f.connect(g);g.connect(c.destination);o.type="sawtooth";o.frequency.setValueAtTime(110,c.currentTime);f.type="lowpass";f.frequency.setValueAtTime(700,c.currentTime);g.gain.setValueAtTime(.22,c.currentTime);g.gain.setValueAtTime(.22,c.currentTime+.25);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start(c.currentTime);o.stop(c.currentTime+.5);}catch(e){}}
function sh(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function pk(a,n){return sh(a).slice(0,n);}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function ri(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

// ═══════════════════ COSMO THE ASTRONAUT HOST ═══════════════════
const COSMO = {
  expr: { idle:"🚀", happy:"🤩", celebrate:"🥳", wrong:"😬", hint:"🧐", thinking:"🤔", excited:"😄" },
  
  greet: [
    "Buckle up! Let's blast off! 🚀","Ready for takeoff, star student?","3... 2... 1... LEARN!","Houston, we have a GENIUS!","Let's explore the universe of knowledge!","Cosmo here — let's do this!","Time to rocket through these questions!"
  ],
  correct: [
    "BOOM! Nailed it! 🌟","OUT OF THIS WORLD! ⭐","You're on FIRE! 🔥","STELLAR answer! 🚀","AMAZING! You're a genius!","YES YES YES! 🎉","Cosmo is IMPRESSED! 🤩","SUPERSTAR! ⭐","That's EXACTLY right!","You make Cosmo proud! 🥳","INCREDIBLE! Keep going!","PERFECT! You're unstoppable!","WOWZA! 🌈","Cosmo does a happy dance! 💃","TOUCHDOWN! 🏆"
  ],
  wrong: [
    "Oops! Let's look at that again 🧐","Almost! Cosmo believes in you!","Not quite — but you're SO close!","Hmm, good try! Here's a hint 💡","Don't give up — Cosmo never gives up!","That one was tricky! Keep going!","Whoops! Even astronauts make mistakes!","No worries — let's learn from it!","You'll get the next one! 🚀"
  ],
  hints: {
    flashcards: ["Look at the question carefully!","Think about what you know!","Take your time — you've got this!"],
    mathpop:    ["Count on your fingers if you need to!","Break it into smaller parts!","Think step by step!"],
    fillblank:  ["Read the whole sentence first!","Which word makes the most sense?","Say it out loud in your head!"],
    truefalse:  ["Think about what you know is TRUE!","Use your common sense!","Eliminate what seems wrong!"],
    unscramble: ["Look for common letter patterns!","What letters usually go together?","Try starting with vowels!"],
    match:      ["Think about what the words have in common!","Look for clues in the words!"],
    wordpicture:["Look at every picture carefully!","Say the word out loud!"],
    rhymetime:  ["Say both words out loud — do they sound the same at the end?","What sound does the word END with?"],
    wordfamily: ["They all end the same way!","Look at the ending sound!"],
    greaterless:["Which number is bigger? Count if you need to!","Bigger numbers come LATER when counting!"],
    oddoneout:  ["Three of them belong together — which one is different?","Think about what they all have in common!"],
    counting:   ["Count them one by one, pointing as you go!","Group them in twos to make it easier!"],
    catsort:    ["Read the category name carefully!","Think about what each word really IS!"],
    placevalue: ["Remember: TENS are on the LEFT, ONES on the RIGHT!","The first digit from the right is always ONES!"],
    skipcounting:["Look at the pattern — how much does it go up each time?","Count by that number on your fingers!"],
    sightwords: ["Look at each letter carefully!","Spell it out loud: what letter comes first?"],
    sentbuild:  ["Sentences usually start with who or what!","Who is doing something? Start there!"],
    compound:   ["Say both words together really fast — what do you get?","Two small words make one big word!"],
    tellingtime:["The short hand = hours, long hand = minutes!","Where is the SHORT hand pointing?"],
    money:      ["Count the biggest coins first!","Quarters=25¢, Dimes=10¢, Nickels=5¢, Pennies=1¢"],
    numorder:   ["Which number is smallest? Put that first!","Count up slowly to find the order!"],
  },

  say(type, gameId) {
    if(type==="greet") return rnd(this.greet);
    if(type==="correct") return rnd(this.correct);
    if(type==="wrong") return rnd(this.wrong);
    if(type==="hint") {
      const hints = this.hints[gameId] || ["Think carefully!","You can do it!","Take your time!"];
      return rnd(hints);
    }
    return "";
  }
};

// Render Cosmo widget
function cosmoWidget(type, gameId, customMsg) {
  const msg = customMsg || COSMO.say(type, gameId);
  const expr = type==="correct" ? COSMO.expr.celebrate :
               type==="wrong"   ? COSMO.expr.wrong :
               type==="hint"    ? COSMO.expr.hint :
               type==="greet"   ? COSMO.expr.excited : COSMO.expr.idle;
  const stateClass = `cosmo-${type==="greet"||type==="idle"?"idle":type}`;
  return `<div class="cosmo-wrap ${stateClass}">
    <div class="cosmo-avatar">${expr}</div>
    <div class="cosmo-bubble">${msg}</div>
  </div>`;
}

// ── CONFETTI EXPLOSION ──
function fireConfetti(x, y) {
  const colors = ["#FFD93D","#FF6B9D","#00D68F","#00A8FF","#FF4757","#9B6FE8","#FF8C00"];
  const container = document.body;
  for(let i = 0; i < 28; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.cssText = `
      left:${(x||50) + (Math.random()-0.5)*60}%;
      top:${y||30}%;
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      transform:rotate(${Math.random()*360}deg);
      animation-delay:${Math.random()*0.3}s;
      animation-duration:${0.9+Math.random()*0.6}s;
      border-radius:${Math.random()>0.5?"50%":"3px"};
    `;
    container.appendChild(el);
    setTimeout(()=>el.remove(), 1600);
  }
}

// ── SCREEN SHAKE ──
function shakeScreen() {
  const app = document.getElementById("app");
  app.style.animation = "wrongShake .45s ease";
  setTimeout(()=>{ app.style.animation=""; }, 500);
}

// ── SPARKLE BURST at element ──
function sparkleAt(el) {
  if(!el) return;
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const emojis = ["✨","⭐","🌟","💫","🎉"];
  for(let i=0; i<6; i++) {
    const s = document.createElement("div");
    s.className = "match-sparkle";
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const angle = (i/6)*360;
    const dist = 40 + Math.random()*30;
    s.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;z-index:9999;pointer-events:none;animation-delay:${i*0.06}s;transform:translate(${Math.cos(angle*Math.PI/180)*dist}px,${Math.sin(angle*Math.PI/180)*dist}px);`;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 800);
  }
}

// ── CORRECT / WRONG visual effects ──
function playCorrectFX(buttonEl) {
  playOK();
  fireConfetti(50, 40);
  if(buttonEl) sparkleAt(buttonEl);
}
function playWrongFX(buttonEl) {
  playNo();
  shakeScreen();
}

function flashCards(lv){
 const rk=["easy","medium","hard"][lv-1];
 const rp=FR[rk],mp=FM[rk];
 const rw=rp.map(x=>x.w),mw=mp.map(x=>x.w);
 const rc=pk(rp,20).map(r=>({type:"reading",question:r.q,answer:r.w,visual:r.v,choices:sh([r.w,...sh(rw.filter(x=>x!==r.w)).slice(0,3)])}));
 const mc=pk(mp,20).map(m=>({type:"math",question:m.q,answer:m.w,visual:m.v,choices:sh([m.w,...sh(mw.filter(x=>x!==m.w)).slice(0,3)])}));
 return sh([...rc,...mc]);
}

// MATH POP - procedural (infinite variety)
function mathPop(lv){
 return Array.from({length:40},()=>{
  let q,a;
  if(lv===1){const x=ri(1,5),y=ri(1,5);if(Math.random()>.5){q=`${x}+${y}`;a=x+y;}else{const s=x+y;q=`${s}-${x}`;a=y;}}
  else if(lv===2){const x=ri(1,10),y=ri(1,10);const t=Math.random();if(t<.4){q=`${x}+${y}`;a=x+y;}else if(t<.7){const s=x+y;q=`${s}-${x}`;a=y;}else{const p=ri(2,5),r2=ri(2,5);q=`${p}×${r2}`;a=p*r2;}}
  else{const x=ri(10,30),y=ri(10,30);const t=Math.random();if(t<.35){q=`${x}+${y}`;a=x+y;}else if(t<.6){const s=x+y;q=`${s}-${x}`;a=y;}else{const p=ri(2,9),r2=ri(2,9);q=`${p}×${r2}`;a=p*r2;}}
  const w=new Set();while(w.size<3){const d=a+ri(-4,4);if(d!==a&&d>=0)w.add(d);}
  return{question:q,answer:a,choices:sh([a,...w])};
 });
}

// NUMBER ORDER - procedural
function numOrder(lv){
 return Array.from({length:40},()=>{
  let nums,dir,label;
  if(lv===1){nums=sh([...new Set(Array.from({length:6},()=>ri(1,20)))].slice(0,4));dir="asc";label="smallest to biggest";}
  else if(lv===2){nums=sh([...new Set(Array.from({length:6},()=>ri(1,100)))].slice(0,4));dir=Math.random()>.5?"asc":"desc";label=dir==="asc"?"smallest to biggest":"biggest to smallest";}
  else{nums=sh([...new Set(Array.from({length:6},()=>ri(1,999)))].slice(0,4));dir=Math.random()>.5?"asc":"desc";label=dir==="asc"?"smallest to biggest":"biggest to smallest";}
  const sorted=[...nums].sort((a,b)=>dir==="asc"?a-b:b-a);
  if(nums.join(",")===sorted.join(","))nums=sh(nums);
  return{numbers:nums,direction:dir,label};
 });
}

function greaterLess(lv){
 return Array.from({length:40},()=>{
  let l,r,answer,question;
  if(lv===1){l=ri(1,9);r=ri(1,9);while(r===l)r=ri(1,9);const t=Math.random();question=t<.5?"Which number is GREATER?":"Which number is LESS?";answer=t<.5?(l>r?"left":"right"):(l<r?"left":"right");}
  else if(lv===2){l=ri(1,50);r=ri(1,50);while(r===l)r=ri(1,50);const t=Math.random();question=t<.5?"Which number is GREATER?":"Which number is LESS?";answer=t<.5?(l>r?"left":"right"):(l<r?"left":"right");}
  else{l=ri(1,999);r=ri(1,999);const t=Math.random();if(t<.3){question="Are these numbers EQUAL?";l=ri(1,100);r=l;answer="equal";}else{question=t<.65?"Which number is GREATER?":"Which number is LESS?";answer=t<.65?(l>r?"left":"right"):(l<r?"left":"right");}}
  return{left:l,right:r,answer,question};
 });
}

const CE=["🍎","🐶","⭐","🎈","🌸","🦋","🍕","🏀","🌟","🐱","🎸","🌈","🍦","🚀","💎","🦊","🐸","🐧"];
function counting(lv){
 return Array.from({length:40},()=>{
  const emoji=rnd(CE);
  const count=lv===1?ri(2,8):lv===2?ri(5,15):ri(10,20);
  const w=new Set();while(w.size<3){const d=count+ri(-3,3);if(d!==count&&d>0)w.add(d);}
  return{emoji,count,choices:sh([count,...w])};
 });
}

// PLACE VALUE - procedural
function placeValue(lv){
 return Array.from({length:40},()=>{
  let num,question,answer,choices;
  if(lv===1){
   num=ri(11,99);const tens=Math.floor(num/10),ones=num%10;
   if(Math.random()>.5){question=`In the number ${num}, what is the TENS digit?`;answer=String(tens);const w=new Set();while(w.size<3){const d=ri(1,9);if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
   else{question=`In the number ${num}, what is the ONES digit?`;answer=String(ones);const w=new Set();while(w.size<3){const d=ri(0,9);if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
  }else if(lv===2){
   num=ri(11,99);const tens=Math.floor(num/10),ones=num%10;
   const t=Math.random();
   if(t<.33){question=`How many TENS are in ${num}?`;answer=String(tens);const w=new Set();while(w.size<3){const d=ri(1,9);if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
   else if(t<.66){question=`What is the value of the tens in ${num}?`;answer=String(tens*10);const w=new Set();while(w.size<3){const d=ri(1,9)*10;if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
   else{question=`How many ONES are in ${num}?`;answer=String(ones);const w=new Set();while(w.size<3){const d=ri(0,9);if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
  }else{
   num=ri(100,999);const h=Math.floor(num/100),t2=Math.floor((num%100)/10),o=num%10;
   const q=Math.random();
   if(q<.33){question=`How many HUNDREDS are in ${num}?`;answer=String(h);const w=new Set();while(w.size<3){const d=ri(1,9);if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
   else if(q<.66){question=`What is the value of the HUNDREDS digit in ${num}?`;answer=String(h*100);const w=new Set();while(w.size<3){const d=ri(1,9)*100;if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
   else{question=`What is the value of the TENS digit in ${num}?`;answer=String(t2*10);const w=new Set();while(w.size<3){const d=ri(0,9)*10;if(String(d)!==answer)w.add(String(d));}choices=sh([answer,...w]);}
  }
  return{number:num,question,answer,choices};
 });
}

// SKIP COUNTING - procedural
function skipCounting(lv){
 return Array.from({length:40},()=>{
  let skipBy,start;
  if(lv===1){skipBy=Math.random()>.5?2:5;start=ri(0,5)*skipBy;}
  else if(lv===2){const opts=[2,5,10];skipBy=rnd(opts);start=ri(0,8)*skipBy;}
  else{const opts=[3,4,6,7];skipBy=rnd(opts);start=ri(0,6)*skipBy;}
  const seq=Array.from({length:5},(_,i)=>start+i*skipBy);
  const mi=ri(0,4);const answer=seq[mi];
  const disp=seq.map((n,i)=>i===mi?null:n);
  const w=new Set();while(w.size<3){const d=answer+skipBy*(ri(0,3)-1);if(d!==answer&&d>=0)w.add(d);}
  return{sequence:disp,skipBy,answer,missingIndex:mi,choices:sh([answer,...w])};
 });
}

// TELLING TIME - procedural
function tellingTime(lv){
 return Array.from({length:40},()=>{
  const h=ri(1,12);
  let m;
  if(lv===1)m=0;
  else if(lv===2)m=Math.random()>.5?0:30;
  else{const opts=[0,15,30,45];m=rnd(opts);}
  const display=`${h}:${m===0?"00":m}`;
  const w=new Set();
  while(w.size<3){
   const wh=ri(1,12);
   let wm;
   if(lv===1)wm=0;
   else if(lv===2)wm=Math.random()>.5?0:30;
   else{const opts=[0,15,30,45];wm=rnd(opts);}
   const wt=`${wh}:${wm===0?"00":wm}`;
   if(wt!==display)w.add(wt);
  }
  return{hours:h,minutes:m,displayTime:display,question:"What time does the clock show?",choices:sh([display,...w])};
 });
}

// MONEY - procedural
const CVAL={quarter:25,dime:10,nickel:5,penny:1};
const CEMO={quarter:"🟡",dime:"🔵",nickel:"🟢",penny:"🟤"};
function countMoney(lv){
 return Array.from({length:40},()=>{
  let coins=[],total=0;
  const types=lv===1?["penny","nickel"]:lv===2?["penny","nickel","dime"]:["penny","nickel","dime","quarter"];
  const n=ri(2,lv===1?4:lv===2?5:6);
  for(let i=0;i<n;i++){const c=rnd(types);coins.push(c);total+=CVAL[c];}
  const answer=`${total} cents`;
  const w=new Set();while(w.size<3){const d=total+ri(-5,5);if(d!==total&&d>0)w.add(`${d} cents`);}
  return{coins,totalCents:total,question:"How much money is this?",choices:sh([answer,...w])};
 });
}

function pendingTap(el,sel,isLocked,onConfirm){
  let pending=null,timer=null;

    if(isLocked())return;
    const ci=parseInt(b.dataset.ci)||b.dataset.side||b.dataset.val;
    function applyHighlight(activeKey){
      el.querySelectorAll(sel).forEach(bb=>{
        const key=parseInt(bb.dataset.ci)||bb.dataset.side||bb.dataset.val;
        const isActive=String(key)===String(activeKey);
        bb.style.transform=isActive?"scale(1.05)":"scale(1)";
        bb.style.opacity=isActive?"1":"0.55";
        bb.style.outline=isActive?"3px solid #6C3FC8":"none";
        bb.style.borderRadius="14px";
      });
      showConfirmHint(el);
    }
    if(pending!==null&&String(pending)===String(ci)){
      clearTimeout(timer);pending=null;
      el.querySelectorAll(sel).forEach(bb=>{bb.style.transform="";bb.style.opacity="";bb.style.outline="";});
      clearConfirmHint(el);
      onConfirm(ci, b);

      clearTimeout(timer);

        if(pending!==null){
          const p=pending;pending=null;
          el.querySelectorAll(sel).forEach(bb=>{bb.style.transform="";bb.style.opacity="";bb.style.outline="";});

          onConfirm(p, b);

    }
  }));
}

// Intercepts the normal game runners to add turn-based logic
let _2pRoundData = null;
let _2pP1Answer  = null; // {correct: bool}

function run2PGame(area, data, lv, gameId){
 const runners = {flashcards:rFlash,mathpop:rPop,fillblank:rFill,match:rMatch,unscramble:rScram,truefalse:rTF,wordpicture:rWP,numorder:rNO,rhymetime:rRhyme,wordfamily:rWF,greaterless:rGL,oddoneout:rOdd,counting:rCount,catsort:rCat,placevalue:rPV,skipcounting:rSC,sightwords:rSW,sentbuild:rSB,compound:rCW,tellingtime:rTT,money:rMoney};
 _2pRoundData = data;
 _2pP1Answer  = null;
 P2.currentTurn = 1;

 // Player 1 plays
 function p1Done(score, total){
  _2pP1Answer = {score, total, correct: score > 0};
  if(_2pP1Answer.correct) P2.p1.stars++;
  // Check if P1 already won
  if(P2.p1.stars >= STARS_TO_WIN){
   document.getElementById("app").innerHTML = renderWinner(1);
   return;
  }
  // Show turn switch screen
  P2.currentTurn = 2;
  document.getElementById("app").innerHTML = renderTurnSwitch(_2pP1Answer.correct);
 }

 runners[gameId](area, data, lv, p1Done);
}

 </div>`;
 const area = document.getElementById("game-area");
 const runners = {flashcards:rFlash,mathpop:rPop,fillblank:rFill,match:rMatch,unscramble:rScram,truefalse:rTF,wordpicture:rWP,numorder:rNO,rhymetime:rRhyme,wordfamily:rWF,greaterless:rGL,oddoneout:rOdd,counting:rCount,catsort:rCat,placevalue:rPV,skipcounting:rSC,sightwords:rSW,sentbuild:rSB,compound:rCW,tellingtime:rTT,money:rMoney};

 function p2Done(score, total){

 runners[S.gameId](area, _2pRoundData, S.level, p2Done);

   <div style="flex:1;background:${_2pP1Answer.correct ? 'rgba(0,214,143,.15)' : 'rgba(255,71,87,.1)'};border:2px solid ${_2pP1Answer.correct ? '#00D68F' : '#FF4757'};border-radius:16px;padding:12px;text-align:center;">
    <div style="font-size:28px;">${c1.emoji}</div>
    <div style="font-family:'Bangers','Arial Black',sans-serif;font-size:14px;color:white;">${P2.p1.name}</div>
    <div style="font-size:20px;">${_2pP1Answer.correct ? '✅' : '❌'}</div>
   </div>
   <div style="flex:1;background:${p2Correct ? 'rgba(0,214,143,.15)' : 'rgba(255,71,87,.1)'};border:2px solid ${p2Correct ? '#00D68F' : '#FF4757'};border-radius:16px;padding:12px;text-align:center;">
    <div style="font-size:28px;">${c2.emoji}</div>
    <div style="font-family:'Bangers','Arial Black',sans-serif;font-size:14px;color:white;">${P2.p2.name}</div>
    <div style="font-size:20px;">${p2Correct ? '✅' : '❌'}</div>
   </div>
  </div>
  <button onclick="ss({screen:'playing'})" style="background:linear-gradient(135deg,#FFD93D,#FF8C00);border:none;border-radius:18px;padding:15px;width:100%;font-family:'Bangers','Arial Black',sans-serif;font-size:22px;color:white;cursor:pointer;box-shadow:0 6px 20px rgba(255,217,61,.4);letter-spacing:1.5px;margin-bottom:10px;">▶ NEXT ROUND!</button>
  <button onclick="ss({screen:'home'})" class="btn bg2" style="letter-spacing:1.5px;font-size:18px;">🏠 HOME</button>
 </div>`;
}

render();


// ═══════════════════ PUZZLE SYSTEM ═══════════════════
const PUZZLE_THEMES=[
  {name:"Cosmo's Space Adventure",emoji:"🚀",pieces:["🌟","🪐","☄️","🌙","🚀","👾","🌌","🛸","⭐"],bg:"linear-gradient(135deg,#0D0428,#2D1566)"},
  {name:"Deep Ocean Treasure",emoji:"🌊",pieces:["🐠","🦈","🐙","🦀","💎","🐚","🐬","🌊","⚓"],bg:"linear-gradient(135deg,#003366,#006994)"},
  {name:"Jungle Safari",emoji:"🦁",pieces:["🦁","🐘","🦒","🦓","🐆","🦍","🦜","🌴","🦋"],bg:"linear-gradient(135deg,#1a4a1a,#2d7a2d)"},
  {name:"Magic Castle Kingdom",emoji:"🏰",pieces:["🏰","🐉","🧙","👑","⚔️","🦄","🧝","🔮","✨"],bg:"linear-gradient(135deg,#2d0a5e,#6b21a8)"},
  {name:"Dino World",emoji:"🦕",pieces:["🦕","🦖","🌋","🥚","🌿","🦴","🌊","☀️","🪨"],bg:"linear-gradient(135deg,#1a3a0a,#3d6b1a)"},
  {name:"Enchanted Forest",emoji:"🌲",pieces:["🌲","🦊","🐺","🍄","🌺","🦔","🌙","⭐","🌿"],bg:"linear-gradient(135deg,#0a2a0a,#1a5a1a)"},
  {name:"Arctic Wonderland",emoji:"❄️",pieces:["🐧","🐻‍❄️","❄️","🌨️","🦭","🐳","🌊","⭐","🏔️"],bg:"linear-gradient(135deg,#001433,#003366)"},
  {name:"Pirate Adventure",emoji:"🏴‍☠️",pieces:["🏴‍☠️","⚓","🗺️","💎","🦜","⚔️","🌊","🏝️","💰"],bg:"linear-gradient(135deg,#1a0a00,#4a2000)"},
];

function getTheme(){
  if(!S.puzzleTheme)S.puzzleTheme=PUZZLE_THEMES[Math.floor(Math.random()*PUZZLE_THEMES.length)];
  return S.puzzleTheme;
}

function awardPiece(){
  if(S.puzzlePieces>=9)return false;
  S.puzzlePieces++;
  S.gamesCompleted++;
  if(S.puzzlePieces>=9&&!S.bonusUnlocked){S.bonusUnlocked=true;}
  return true;
}

function resetPuzzle(){
  S.puzzlePieces=0;
  S.puzzleTheme=PUZZLE_THEMES[Math.floor(Math.random()*PUZZLE_THEMES.length)];
  S.bonusUnlocked=false;
}

function renderPuzzleWidget(){
  const t=getTheme();
  const filled=S.puzzlePieces;
  const done=filled>=9;
  const cells=t.pieces.map((p,i)=>{
    const isF=i<filled;
    const isNew=i===filled-1;
    return `<div class="puzzle-cell ${isF?(isNew?'newest':'filled'):'empty'}"
      style="background:${isF?'rgba(255,255,255,.15)':'rgba(255,255,255,.05)'};
             border:${isF?'2px solid rgba(255,255,255,.35)':'2px dashed rgba(255,255,255,.15)'};
             box-shadow:${isF?'0 3px 10px rgba(0,0,0,.3)':'none'};
             animation-delay:${isNew?.1:i*.04}s;">
      ${isF?`<span style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))">${p}</span>`:''}
    </div>`;
  }).join('');

  return `<div style="background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:20px;padding:12px;margin-bottom:12px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div style="font-family:'Bangers','Arial Black',sans-serif;font-size:16px;color:white;letter-spacing:1px;">${t.emoji} ${t.name}</div>
      <div style="font-family:'Bangers','Arial Black',sans-serif;font-size:14px;color:#FFD93D;">${filled}/9</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;">${cells}</div>
    ${done
      ? `<button onclick="ss({screen:'spacerun'})" style="width:100%;background:linear-gradient(135deg,#FFD93D,#FF8C00);border:none;border-radius:14px;padding:10px;font-family:'Bangers','Arial Black',sans-serif;font-size:20px;color:white;cursor:pointer;letter-spacing:1.5px;box-shadow:0 4px 16px rgba(255,217,61,.5);animation:bonusReveal .6s ease;">
          🎮 PLAY COSMO'S SPACE RUN!
        </button>`
      : `<div style="background:rgba(0,0,0,.2);border-radius:10px;height:8px;overflow:hidden;">
          <div style="height:100%;width:${Math.round((filled/9)*100)}%;background:linear-gradient(90deg,#FFD93D,#FF8C00);border-radius:10px;transition:width .5s ease;"></div>
        </div>
        <div style="font-family:'Nunito',sans-serif;font-size:12px;color:rgba(255,255,255,.5);text-align:center;margin-top:5px;">
          ${9-filled} more ${9-filled===1?'game':'games'} to unlock Cosmo's Space Run! 🚀
        </div>`
    }
  </div>`;
}

// ═══════════════════ COSMO'S SPACE RUN GAME ═══════════════════
function renderSpaceRun(){
  return `<div class="screen" style="padding-top:12px;animation:slideUp .4s ease;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <button onclick="ss({screen:'home'})" style="background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:12px;padding:7px 12px;cursor:pointer;font-family:'Bangers','Arial Black',sans-serif;font-size:14px;color:rgba(255,255,255,.7);letter-spacing:1px;">← BACK</button>
      <div style="font-family:'Bangers','Arial Black',sans-serif;font-size:16px;color:white;letter-spacing:1px;">🚀 COSMO'S SPACE RUN</div>
      <div style="width:60px;"></div>
    </div>
    <div style="background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:20px;padding:14px;text-align:center;margin-bottom:12px;">
      <div style="font-size:52px;animation:float 2s ease-in-out infinite;display:inline-block;">🚀</div>
      <h2 style="font-family:'Bangers','Arial Black',sans-serif;font-size:28px;letter-spacing:2px;color:white;margin:6px 0;">COSMO'S SPACE RUN!</h2>
      <p style="font-family:'Nunito',sans-serif;font-size:14px;color:rgba(255,255,255,.7);margin-bottom:4px;">🌟 Collect <b>10 stars</b> to win!</p>
      <p style="font-family:'Nunito',sans-serif;font-size:13px;color:rgba(255,255,255,.5);">💥 3 lives · Tap anywhere to jump · Double-tap to double jump</p>
      ${S.spaceRunBest>0?`<div style="font-family:'Bangers','Arial Black',sans-serif;font-size:15px;color:#FFD93D;margin-top:6px;">🏆 BEST: ${S.spaceRunBest} stars</div>`:''}
    </div>
    <canvas id="space-run-canvas" width="400" height="300"></canvas>
    <div id="run-ui" style="margin-top:10px;"></div>
  </div>`;
}

function startSpaceRun(){
  const canvas=document.getElementById('space-run-canvas');
  if(!canvas)return;
  
  // Resize canvas to screen width
  const w=Math.min(window.innerWidth-20, 420);
  canvas.width=w; canvas.height=Math.round(w*0.65);
  const ctx=canvas.getContext('2d');
  const H=canvas.height, W=canvas.width;
  const GROUND=H*0.78;
  
  // Game state
  let stars=0, lives=3, gameOver=false, won=false, frame=0, speed=3.5;
  let lastTime=0, raf=null;
  
  // Cosmo player
  let cosmo={
    x:W*0.15, y:GROUND, vy:0, jumps:0,
    isJumping:false, w:36, h:36, dead:false,
    hitTimer:0
  };
  const GRAVITY=0.55, JUMP=-13, MAX_JUMPS=2;
  
  // Obstacles pool
  let obstacles=[];
  let starItems=[];
  let particles=[];
  let obstacleCooldown=80;
  let starCooldown=50;
  
  // Ground scroll
  let groundX=0;
  
  // Star items in sky
  function spawnStar(){
    const h=GROUND-(40+Math.random()*H*0.45);
    starItems.push({x:W+30, y:h, collected:false, collectTimer:0});
  }
  
  // Obstacles
  const OBS_TYPES=[
    {emoji:'☄️', w:32, h:32, y:()=>GROUND-20},
    {emoji:'👾', w:34, h:30, y:()=>GROUND-22},
    {emoji:'🪨', w:30, h:28, y:()=>GROUND-16},
    {emoji:'🛸', w:36, h:28, y:()=>GROUND-H*0.35-10},  // flying obstacle
    {emoji:'☄️', w:28, h:28, y:()=>GROUND-H*0.25},     // mid-air
  ];
  function spawnObstacle(){
    const t=OBS_TYPES[Math.floor(Math.random()*OBS_TYPES.length)];
    obstacles.push({x:W+40, y:t.y(), emoji:t.emoji, w:t.w, h:t.h});
  }
  
  // Particles
  function addParticles(x,y,color,count){
    for(let i=0;i<count;i++){
      const angle=Math.random()*Math.PI*2;
      const spd=2+Math.random()*4;
      particles.push({x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd-3,
        life:1,color,size:3+Math.random()*5});
    }
  }
  
  // Input - tap to jump
  function doJump(){
    if(gameOver||won)return;
    if(cosmo.jumps<MAX_JUMPS){
      cosmo.vy=JUMP*(cosmo.jumps===0?1:0.85);
      cosmo.jumps++;
      cosmo.isJumping=true;
      addParticles(cosmo.x+cosmo.w/2, cosmo.y+cosmo.h,'rgba(255,217,61,.8)',6);
    }
  }
  
  canvas.addEventListener('touchstart',(e)=>{e.preventDefault();doJump();},{passive:false});
  canvas.addEventListener('mousedown',doJump);
  
  // Update UI
  function updateUI(){
    const ui=document.getElementById('run-ui');
    if(!ui)return;
    const livesStr=Array.from({length:3}).map((_,i)=>`<span style="font-size:22px;${i>=lives?'opacity:.2':''}">${i<lives?'❤️':'🖤'}</span>`).join('');
    const starsStr=`<span style="font-family:'Bangers','Arial Black',sans-serif;font-size:20px;color:#FFD93D;letter-spacing:1px;">⭐ ${stars}/10</span>`;
    ui.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 8px;">${livesStr}${starsStr}</div>`;
  }
  
  // Draw everything
  function draw(){
    ctx.clearRect(0,0,W,H);
    
    // Sky gradient
    const sky=ctx.createLinearGradient(0,0,0,GROUND);
    sky.addColorStop(0,'#060018');
    sky.addColorStop(0.5,'#1A0A3E');
    sky.addColorStop(1,'#0D1B3E');
    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,GROUND);
    
    // Stars in sky (bg)
    ctx.fillStyle='rgba(255,255,255,0.7)';
    for(let i=0;i<20;i++){
      const sx=((i*137+frame*0.3)%(W+50))-25;
      const sy=(i*53)%(GROUND*0.7)+10;
      ctx.beginPath();
      ctx.arc(sx,sy,0.8+Math.sin(frame*.05+i)*.4,0,Math.PI*2);
      ctx.fill();
    }
    
    // Ground
    const grd=ctx.createLinearGradient(0,GROUND,0,H);
    grd.addColorStop(0,'#1a5a0a');
    grd.addColorStop(0.3,'#0d3306');
    grd.addColorStop(1,'#061a03');
    ctx.fillStyle=grd;
    ctx.fillRect(0,GROUND,W,H-GROUND);
    
    // Ground line detail
    ctx.strokeStyle='rgba(0,214,143,.4)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);
    ctx.stroke();
    
    // Scrolling ground dots
    ctx.fillStyle='rgba(0,214,143,.3)';
    for(let i=0;i<8;i++){
      const gx=((i*60-groundX%60+W)%W);
      ctx.fillRect(gx,GROUND+4,20,2);
    }
    
    // Draw star items
    starItems.forEach(s=>{
      if(s.collected){
        ctx.globalAlpha=1-s.collectTimer/20;
        ctx.font=`${20+s.collectTimer}px serif`;
        ctx.fillText('⭐',s.x-10,s.y-s.collectTimer*3);
        ctx.globalAlpha=1;
      } else {
        const bob=Math.sin(frame*0.08+s.x)*4;
        ctx.font='24px serif';
        ctx.fillText('⭐',s.x-12,s.y+bob);
        // Glow
        ctx.shadowColor='#FFD93D';
        ctx.shadowBlur=10+Math.sin(frame*.1)*4;
        ctx.fillText('⭐',s.x-12,s.y+bob);
        ctx.shadowBlur=0;
      }
    });
    
    // Draw obstacles
    obstacles.forEach(o=>{
      ctx.font=`${o.w}px serif`;
      ctx.fillText(o.emoji,o.x-o.w/2,o.y+o.h);
    });
    
    // Draw particles
    particles.forEach(p=>{
      ctx.globalAlpha=p.life;
      ctx.fillStyle=p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
    });
    
    // Draw Cosmo
    const cosmoY=cosmo.y-cosmo.h;
    if(cosmo.hitTimer>0){
      ctx.globalAlpha=0.4+Math.sin(cosmo.hitTimer*1.5)*0.4;
    }
    const lean=cosmo.isJumping&&cosmo.vy<0?-15:cosmo.vy>3?10:0;
    ctx.save();
    ctx.translate(cosmo.x+cosmo.w/2,cosmoY+cosmo.h/2);
    ctx.rotate(lean*Math.PI/180);
    ctx.font=`${cosmo.w}px serif`;
    ctx.fillText('🚀',-(cosmo.w/2),cosmo.h/2);
    ctx.restore();
    ctx.globalAlpha=1;
    
    // Cosmo running animation when on ground
    if(!cosmo.isJumping){
      const bounce=Math.sin(frame*0.25)*2;
      ctx.font='16px serif';
      ctx.fillText('💨',cosmo.x-10,cosmoY+cosmo.h+2+bounce);
    }
    
    // Speed lines (fast feel)
    if(speed>5){
      ctx.strokeStyle=`rgba(255,255,255,${(speed-5)*0.03})`;
      ctx.lineWidth=1;
      for(let i=0;i<5;i++){
        const ly=20+i*50+Math.random()*20;
        const lx=W*0.3+Math.random()*W*0.4;
        ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx-40,ly);ctx.stroke();
      }
    }
    
    // Game over overlay
    if(gameOver){
      ctx.fillStyle='rgba(0,0,0,.7)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle='white';
      ctx.font=`bold ${W*0.1}px 'Bangers',sans-serif`;
      ctx.textAlign='center';
      ctx.fillText('GAME OVER!',W/2,H/2-20);
      ctx.font=`${W*0.065}px 'Nunito',sans-serif`;
      ctx.fillText(`⭐ ${stars} stars collected`,W/2,H/2+20);
      ctx.font=`${W*0.055}px sans-serif`;
      ctx.fillText('Tap to try again',W/2,H/2+52);
      ctx.textAlign='left';
    }
    
    if(won){
      ctx.fillStyle='rgba(0,0,0,.6)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      // Fireworks
      for(let i=0;i<8;i++){
        const fx=W*(.15+i*.1);
        const fy=H*.1+Math.sin(frame*.1+i)*(H*.2);
        ctx.font='20px serif';
        ctx.fillText(['🎆','🎇','✨','🌟','🎉'][i%5],fx,fy);
      }
      ctx.fillStyle='#FFD93D';
      ctx.font=`bold ${W*0.1}px 'Bangers',sans-serif`;
      ctx.fillText('YOU WIN! 🏆',W/2,H/2-20);
      ctx.fillStyle='white';
      ctx.font=`${W*0.065}px 'Nunito',sans-serif`;
      ctx.fillText('All 10 stars collected!',W/2,H/2+20);
      ctx.font=`${W*0.055}px sans-serif`;
      ctx.fillText('Tap to play again',W/2,H/2+52);
      ctx.textAlign='left';
    }
  }
  
  // Physics & logic update
  function update(dt){
    if(gameOver||won)return;
    frame++;
    speed=3.5+Math.min(frame*0.003,3); // gradually speeds up to max 6.5
    groundX+=speed;
    
    // Cosmo physics
    cosmo.vy+=GRAVITY;
    cosmo.y+=cosmo.vy;
    if(cosmo.y>=GROUND){
      cosmo.y=GROUND;
      cosmo.vy=0;
      cosmo.jumps=0;
      cosmo.isJumping=false;
    }
    if(cosmo.hitTimer>0)cosmo.hitTimer--;
    
    // Spawn obstacles
    obstacleCooldown--;
    if(obstacleCooldown<=0){
      spawnObstacle();
      obstacleCooldown=Math.max(55,100-Math.floor(frame/120)*5)+Math.floor(Math.random()*40);
    }
    
    // Spawn stars
    starCooldown--;
    if(starCooldown<=0&&stars+starItems.filter(s=>!s.collected).length<10){
      spawnStar();
      starCooldown=80+Math.floor(Math.random()*60);
    }
    
    // Move obstacles
    obstacles.forEach(o=>o.x-=speed);
    obstacles=obstacles.filter(o=>o.x>-60);
    
    // Move stars
    starItems.forEach(s=>{
      if(!s.collected)s.x-=speed;
      else s.collectTimer++;
    });
    starItems=starItems.filter(s=>s.x>-40&&s.collectTimer<25);
    
    // Update particles
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life-=0.04;p.size*=0.97;});
    particles=particles.filter(p=>p.life>0);
    
    // Cosmo hitbox (smaller than visual for fairness)
    const cx=cosmo.x+8, cy=cosmo.y-cosmo.h+6, cw=cosmo.w-16, ch=cosmo.h-10;
    
    // Check star collection
    starItems.forEach(s=>{
      if(!s.collected&&s.x>cx&&s.x<cx+cw&&s.y>cy&&s.y<cy+ch+20){
        s.collected=true;
        stars++;
        addParticles(s.x,s.y,'#FFD93D',12);
        if(stars>=10){
          won=true;
          if(stars>S.spaceRunBest)S.spaceRunBest=stars;
          cancelAnimationFrame(raf);
          updateUI();
          draw();
          // Replay on tap
          canvas.addEventListener('touchstart',()=>location.reload?startSpaceRunGame():ss({screen:'spacerun'}),{once:true});
          canvas.addEventListener('mousedown',()=>startSpaceRunGame(),{once:true});
          return;
        }
      }
    });
    
    // Check obstacle collisions
    if(cosmo.hitTimer===0){
      obstacles.forEach(o=>{
        const ox=o.x-o.w/2+6, ow=o.w-12;
        if(cx<ox+ow&&cx+cw>ox&&cy<o.y+o.h&&cy+ch>o.y){
          lives--;
          cosmo.hitTimer=80;
          addParticles(cosmo.x+cosmo.w/2,cosmo.y-cosmo.h/2,'rgba(255,71,87,.9)',15);
          obstacles=obstacles.filter(ob=>ob!==o);
          if(lives<=0){
            gameOver=true;
            if(stars>S.spaceRunBest)S.spaceRunBest=stars;
            cancelAnimationFrame(raf);
            updateUI();
            draw();
            canvas.addEventListener('touchstart',()=>startSpaceRunGame(),{once:true});
            canvas.addEventListener('mousedown',()=>startSpaceRunGame(),{once:true});
          }
        }
      });
    }
    
    updateUI();
  }
  
  // Game loop
  function loop(ts){
    const dt=Math.min((ts-lastTime)/16.7,3);
    lastTime=ts;
    update(dt);
    draw();
    if(!gameOver&&!won)raf=requestAnimationFrame(loop);
  }
  
  updateUI();
  raf=requestAnimationFrame(loop);
}

function startSpaceRunGame(){
  // Re-render the screen fresh then start
  document.getElementById('app').innerHTML = '';
  // Small delay to let render happen
  ss({screen:'spacerun'});
  setTimeout(startSpaceRun, 100);
}

</script>
